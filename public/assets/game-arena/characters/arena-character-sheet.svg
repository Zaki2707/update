    <g id="char-petir"><image href="hero-petir.svg" width="210" height="270" preserveAspectRatio="xMidYMid meet"/></g>
  </defs>

  <!-- 4 poses per character: idle, action, impact, victory -->
  <g id="row-bintang" transform="translate(0 0)">
    <use href="#char-bintang" x="0" y="0"/>
    <g transform="translate(210 0) rotate(-7 105 135) translate(0 -5)"><use href="#char-bintang"/></g>
    <g transform="translate(420 0) rotate(7 105 145) translate(8 9) scale(.92 .88)"><use href="#char-bintang"/></g>
    <g transform="translate(630 0) translate(0 -10) scale(1.03)"><use href="#char-bintang"/></g>
  </g>
  <g id="row-roket" transform="translate(0 270)">
