<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 1620">
  <defs>
    <g id="char-bintang"><image href="hero-bintang.svg" width="210" height="270" preserveAspectRatio="xMidYMid meet"/></g>
    <g id="char-roket"><image href="hero-roket.svg" width="210" height="270" preserveAspectRatio="xMidYMid meet"/></g>
    <g id="char-buku"><image href="hero-buku.svg" width="210" height="270" preserveAspectRatio="xMidYMid meet"/></g>
    <g id="char-komet"><image href="hero-komet.svg" width="210" height="270" preserveAspectRatio="xMidYMid meet"/></g>
