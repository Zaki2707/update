name: One-shot Cloud Run Restore Fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-restore-cloudrun-fix.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.14.0'
          cache: npm

      - name: Patch browser storage and restore flow
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          app_path = Path('src/appScript.js')
          app = app_path.read_text(encoding='utf-8')

          marker = "function safeSetLocalStorage(key, value) {"
          if marker not in app:
              raise SystemExit('safeSetLocalStorage marker not found')

          helper = r'''const ONLINE_SERVER_AUTH_STORAGE_KEYS = new Set([
    'madrasah_settings',
    'madrasah_students',
    'madrasah_teachers',
    'madrasah_classes',
    'madrasah_subjects',
    'madrasah_attendance',
    'madrasah_attendance_photos',
    'madrasah_teacherAttendance',
    'madrasah_teacher_attendance',
    'madrasah_teacherAttendance_photos',
    'madrasah_teacher_attendance_photos',
    'madrasah_questions',
    'madrasah_questionBank',
    'madrasah_questionBankGroups',
    'madrasah_question_groups',
    'madrasah_questionBank_photos',
    'madrasah_schedules',
    'madrasah_savedRosters',
    'madrasah_timeSlots',
    'madrasah_kbmDuration',
    'madrasah_exams',
    'madrasah_rooms',
    'madrasah_journals',
    'madrasah_gradeCategories',
    'madrasah_grade_categories',
    'madrasah_generated_exams',
    'madrasah_generatedExams',
    'madrasah_lessonPlans',
    'madrasah_lesson_plans',
    'madrasah_grades',
    'madrasah_customGradeColumns',
    'madrasah_schoolLocationSettings',
    'madrasah_madrasahs',
    'madrasah_photoCloudinaryMap'
]);

function isOnlineServerAuthoritativeStorage() {
    try {
        if (window.isOfflineMode === true || appState?.isOfflineMode === true) return false;
        if (window.isOfflineMode === false || appState?.isOfflineMode === false) return true;
    } catch (_) {}
    return false;
}

function purgeOnlineServerAuthoritativeCaches() {
    if (!isOnlineServerAuthoritativeStorage()) return;
    try {
        for (const key of ONLINE_SERVER_AUTH_STORAGE_KEYS) localStorage.removeItem(key);
        for (let i = localStorage.length - 1; i >= 0; i--) {
            const key = localStorage.key(i);
            if (key && (key === 'madrasah_lkpdList' || /^madrasah_.+_lkpdList$/.test(key))) {
                localStorage.removeItem(key);
            }
        }
    } catch (_) {}
}
window.isOnlineServerAuthoritativeStorage = isOnlineServerAuthoritativeStorage;
window.purgeOnlineServerAuthoritativeCaches = purgeOnlineServerAuthoritativeCaches;

'''
          if 'ONLINE_SERVER_AUTH_STORAGE_KEYS' not in app:
              app = app.replace(marker, helper + marker, 1)

          safe_marker = "    if (!storageKey) return false;\n"
          safe_add = r'''

    // Cloud Run/online mode is server-authoritative. Keep only session and CBT
    // recovery/offline-queue data in browser storage; purge replicated datasets.
    if (isOnlineServerAuthoritativeStorage() && ONLINE_SERVER_AUTH_STORAGE_KEYS.has(storageKey)) {
        try { localStorage.removeItem(storageKey); } catch (_) {}
        return true;
    }
'''
          if 'Cloud Run/online mode is server-authoritative.' not in app:
              app = app.replace(safe_marker, safe_marker + safe_add, 1)

          mode_old = "            appState.isOfflineMode = !!data.isOfflineMode;\n            window.isOfflineMode = !!data.isOfflineMode;"
          mode_new = mode_old + "\n            if (!window.isOfflineMode) purgeOnlineServerAuthoritativeCaches();"
          if mode_old in app and 'if (!window.isOfflineMode) purgeOnlineServerAuthoritativeCaches();' not in app:
              app = app.replace(mode_old, mode_new, 1)

          attendance_start = "    if (key === 'attendance' || key === 'teacherAttendance') {\n        try {"
          attendance_repl = "    if (key === 'attendance' || key === 'teacherAttendance') {\n        if (isOnlineServerAuthoritativeStorage()) {\n            try {\n                localStorage.removeItem('madrasah_' + key);\n                localStorage.removeItem('madrasah_' + key + '_photos');\n                if (key === 'teacherAttendance') localStorage.removeItem('madrasah_teacher_attendance_photos');\n            } catch (_) {}\n        } else {\n        try {"
          if attendance_start in app and "if (isOnlineServerAuthoritativeStorage()) {\n            try {\n                localStorage.removeItem('madrasah_' + key);" not in app:
              app = app.replace(attendance_start, attendance_repl, 1)
              attendance_end = "        } catch(err) {\n            console.error('Error separating photo from ' + key, err);\n            safeSetLocalStorage('madrasah_' + key, appState[key]);\n        }\n    } else {"
              attendance_end_repl = "        } catch(err) {\n            console.error('Error separating photo from ' + key, err);\n            safeSetLocalStorage('madrasah_' + key, appState[key]);\n        }\n        }\n    } else {"
              if attendance_end not in app:
                  raise SystemExit('saveState attendance closing marker not found')
              app = app.replace(attendance_end, attendance_end_repl, 1)

          app_path.write_text(app, encoding='utf-8')

          settings_path = Path('src/settingsAndMisc.js')
          s = settings_path.read_text(encoding='utf-8')

          backup_marker = "        const backupData = {\n            version: '2.0',"
          if backup_marker not in s:
              raise SystemExit('backupData marker not found')
          s = s.replace(backup_marker, "        const isOfflineBackupMode = (window.isOfflineMode === true || appState.isOfflineMode === true);\n        const backupData = {\n            version: '2.1',", 1)
          s = s.replace("            localStorageDump: {}\n", "            ...(isOfflineBackupMode ? { localStorageDump: {} } : {})\n", 1)

          backup_loop = "        if (incSettings) {\n            for (let i = 0; i < localStorage.length; i++) {\n                const key = localStorage.key(i);\n                if (key && key.startsWith('madrasah_')) {\n                    backupData.localStorageDump[key] = localStorage.getItem(key);\n                    backupData[key] = localStorage.getItem(key); // backwards compatibility\n                }\n            }\n        }"
          backup_loop_new = "        // Browser cache is not part of an online/Cloud Run backup.\n        // Keep the legacy dump only for true offline installations.\n        if (incSettings && isOfflineBackupMode) {\n            for (let i = 0; i < localStorage.length; i++) {\n                const key = localStorage.key(i);\n                if (key && key.startsWith('madrasah_')) {\n                    backupData.localStorageDump[key] = localStorage.getItem(key);\n                    backupData[key] = localStorage.getItem(key); // offline backwards compatibility\n                }\n            }\n        }"
          if backup_loop not in s:
              raise SystemExit('backup localStorage loop marker not found')
          s = s.replace(backup_loop, backup_loop_new, 1)

          restore_data_marker = "        if (!data || typeof data !== 'object') {\n            throw new Error('Format file backup tidak valid.');\n        }\n"
          restore_data_new = restore_data_marker + "\n        const legacyDump = (data.localStorageDump && typeof data.localStorageDump === 'object' && !Array.isArray(data.localStorageDump))\n            ? data.localStorageDump\n            : {};\n"
          if 'const legacyDump = (data.localStorageDump' not in s:
              s = s.replace(restore_data_marker, restore_data_new, 1)

          arr_loop_old = "            for (const lk of legacyKeys) {\n                if (Array.isArray(data[lk])) return data[lk];\n                if (typeof data[lk] === 'string') {\n                    try {\n                        const parsed = JSON.parse(data[lk]);\n                        if (Array.isArray(parsed)) return parsed;\n                    } catch (e) {}\n                }\n            }"
          arr_loop_new = "            for (const lk of legacyKeys) {\n                const candidate = data[lk] !== undefined ? data[lk] : legacyDump[lk];\n                if (Array.isArray(candidate)) return candidate;\n                if (typeof candidate === 'string') {\n                    try {\n                        const parsed = JSON.parse(candidate);\n                        if (Array.isArray(parsed)) return parsed;\n                    } catch (e) {}\n                }\n            }"
          if arr_loop_old not in s:
              raise SystemExit('legacy array parser marker not found')
          s = s.replace(arr_loop_old, arr_loop_new, 1)

          obj_loop_old = "            for (const lk of legacyKeys) {\n                if (data[lk] && typeof data[lk] === 'object') return data[lk];\n                if (typeof data[lk] === 'string') {\n                    try {\n                        const parsed = JSON.parse(data[lk]);\n                        if (parsed && typeof parsed === 'object') return parsed;\n                    } catch (e) {}\n                }\n            }"
          obj_loop_new = "            for (const lk of legacyKeys) {\n                const candidate = data[lk] !== undefined ? data[lk] : legacyDump[lk];\n                if (candidate && typeof candidate === 'object') return candidate;\n                if (typeof candidate === 'string') {\n                    try {\n                        const parsed = JSON.parse(candidate);\n                        if (parsed && typeof parsed === 'object') return parsed;\n                    } catch (e) {}\n                }\n            }"
          if obj_loop_old not in s:
              raise SystemExit('legacy object parser marker not found')
          s = s.replace(obj_loop_old, obj_loop_new, 1)

          restore_mode_marker = "        const incSettings = cbSettings ? cbSettings.checked : true;\n"
          if 'const isOfflineRestoreMode =' not in s:
              s = s.replace(restore_mode_marker, restore_mode_marker + "        const isOfflineRestoreMode = (window.isOfflineMode === true || appState.isOfflineMode === true);\n", 1)

          start_marker = "                // Restore via server API with fallback for 413 Payload Too Large"
          end_marker = "                // Explicitly persist selected restored data arrays & objects to localStorage & appState"
          start = s.find(start_marker)
          end = s.find(end_marker, start)
          if start < 0 or end < 0:
              raise SystemExit('restore server block markers not found')

          new_server_block = r'''                // Restore through the dedicated server API. Online/Cloud Run must fail closed:
                // a failed authoritative write must never be converted into a fake success toast.
                let serverRestored = false;
                let mergedServerData = null;
                let serverRestoreError = null;

                const parseRestoreResponse = async (response, label) => {
                    let json = null;
                    try { json = await response.json(); } catch (_) {}
                    if (!response.ok || !json || json.success === false) {
                        const detail = json && json.message ? json.message : `HTTP ${response.status}`;
                        throw new Error(`${label}: ${detail}`);
                    }
                    return json;
                };

                const uploadRestoreChunks = async (payloadString) => {
                    const chunkSize = 500000;
                    const uploadId = `restore_${Date.now()}_${Math.random().toString(36).slice(2, 8)}`;
                    const totalChunks = Math.ceil(payloadString.length / chunkSize);
                    for (let i = 0; i < totalChunks; i++) {
                        const chunkData = payloadString.slice(i * chunkSize, (i + 1) * chunkSize);
                        const response = await fetch('/api/system/restore/chunk', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ uploadId, chunkData, chunkIndex: i, totalChunks })
                        });
                        const json = await parseRestoreResponse(response, `Restore bagian ${i + 1}/${totalChunks} gagal`);
                        if (json.merged) mergedServerData = json.merged;
                    }
                    serverRestored = true;
                };

                try {
                    const payloadString = JSON.stringify(restorePayload);
                    if (payloadString.length > 500000) {
                        await uploadRestoreChunks(payloadString);
                    } else {
                        const response = await fetch('/api/system/restore', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: payloadString
                        });
                        if (response.status === 413) {
                            await uploadRestoreChunks(payloadString);
                        } else {
                            const json = await parseRestoreResponse(response, 'Restore server gagal');
                            if (json.merged) mergedServerData = json.merged;
                            serverRestored = true;
                        }
                    }
                } catch (err) {
                    serverRestoreError = err;
                    console.warn('Server restore error:', err);
                }

                if (!serverRestored) {
                    if (!isOfflineRestoreMode) {
                        throw serverRestoreError || new Error('Restore Cloud Run gagal disimpan ke server.');
                    }

                    // Offline-only compatibility fallback. Every write is verified; one failure
                    // aborts the restore instead of reporting success with partial data.
                    for (const [key, lsKey, val] of componentsToSync) {
                        if (val === undefined || val === null) continue;
                        const response = await fetch('/api/sync-state', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ key, data: val })
                        });
                        let json = null;
                        try { json = await response.json(); } catch (_) {}
                        if (!response.ok || (json && json.success === false)) {
                            throw new Error((json && json.message) || `Gagal menyimpan komponen ${key}.`);
                        }
                    }
                    serverRestored = true;
                }

'''
          s = s[:start] + new_server_block + s[end:]

          persist_start_marker = "                // Explicitly persist selected restored data arrays & objects to localStorage & appState"
          toast_marker = "                if (window.showToast) {\n                    window.showToast('Data berhasil dipulihkan! Memuat ulang sistem...', 'success');\n                }"
          pstart = s.find(persist_start_marker)
          pend = s.find(toast_marker, pstart)
          if pstart < 0 or pend < 0:
              raise SystemExit('restore local persistence block markers not found')

          new_persist_block = r'''                if (isOfflineRestoreMode) {
                    // Offline installations still need browser/local cache for continuity.
                    for (const [key, lsKey, val] of componentsToSync) {
                        let finalVal = val;
                        if (mergedServerData && mergedServerData[key] !== undefined) finalVal = mergedServerData[key];
                        if (finalVal === undefined || finalVal === null) continue;
                        if (key === 'students') appState[key] = sortStudentsByNis(finalVal);
                        else appState[key] = finalVal;
                        if (key === 'questions') appState.questionBank = finalVal;
                        if (window.safeSetLocalStorage) window.safeSetLocalStorage(lsKey, appState[key]);
                        else {
                            try { localStorage.setItem(lsKey, JSON.stringify(appState[key])); } catch (_) {}
                        }
                        if (lsKey === 'madrasah_questionBankGroups') {
                            if (window.safeSetLocalStorage) window.safeSetLocalStorage('madrasah_question_groups', finalVal);
                            else {
                                try { localStorage.setItem('madrasah_question_groups', JSON.stringify(finalVal)); } catch (_) {}
                            }
                        }
                    }
                } else {
                    // Cloud Run: never duplicate restored server datasets into localStorage.
                    // Remove legacy/stale caches and reload authoritative data from the server.
                    if (typeof window.purgeOnlineServerAuthoritativeCaches === 'function') {
                        window.purgeOnlineServerAuthoritativeCaches();
                    } else {
                        for (const [, lsKey] of componentsToSync) {
                            try { localStorage.removeItem(lsKey); } catch (_) {}
                        }
                        try { localStorage.removeItem('madrasah_question_groups'); } catch (_) {}
                    }

                    if (typeof window.loadDataFromServer === 'function') {
                        await window.loadDataFromServer();
                    } else if (mergedServerData) {
                        for (const [key, , val] of componentsToSync) {
                            const finalVal = mergedServerData[key] !== undefined ? mergedServerData[key] : val;
                            if (finalVal === undefined || finalVal === null) continue;
                            if (key === 'students') appState.students = sortStudentsByNis(finalVal);
                            else appState[key] = finalVal;
                            if (key === 'questions') appState.questionBank = finalVal;
                        }
                    }
                }

'''
          s = s[:pstart] + new_persist_block + s[pend:]
          s = s.replace("window.showToast('Data berhasil dipulihkan! Memuat ulang sistem...', 'success');",
                        "window.showToast(isOfflineRestoreMode ? 'Data berhasil dipulihkan! Memuat ulang sistem...' : 'Restore Cloud Run berhasil disimpan ke server dan data telah dimuat ulang dari sumber utama.', 'success');", 1)

          settings_path.write_text(s, encoding='utf-8')

          # src is authoritative; public mirrors build source.
          Path('public/appScript.js').write_text(app, encoding='utf-8')
          Path('public/settingsAndMisc.js').write_text(s, encoding='utf-8')
          PY

      - name: Install locked dependencies
        run: npm ci

      - name: Dependency security audit
        run: npm audit --audit-level=high

      - name: Application security audit
        run: npm run security:audit

      - name: TypeScript check
        run: npm run lint

      - name: Production build
        shell: bash
        run: |
          rm -rf dist
          npm run build
          test -f dist/server.cjs
          git diff --check

      - name: Verify source-public parity and intended scope
        shell: bash
        run: |
          cmp -s src/appScript.js public/appScript.js
          cmp -s src/settingsAndMisc.js public/settingsAndMisc.js
          changed="$(git diff --name-only | sort)"
          printf '%s\n' "$changed"
          bad="$(printf '%s\n' "$changed" | grep -v -E '^(src|public)/(appScript|settingsAndMisc)\.js$' || true)"
          if [ -n "$bad" ]; then
            echo "Unexpected files changed:"
            printf '%s\n' "$bad"
            exit 1
          fi

      - name: Commit validated restore fix
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No patch changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/appScript.js public/appScript.js src/settingsAndMisc.js public/settingsAndMisc.js
          git commit -m 'fix: make Cloud Run restore server-authoritative'
          git push origin HEAD:main
