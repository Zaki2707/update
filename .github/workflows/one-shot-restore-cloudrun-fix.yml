name: One-shot Cloud Run Restore Fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-restore-cloudrun-fix.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.14.0'
          cache: npm

      - name: Patch restore mode declaration
        run: python3 .github/scripts/restore_fix_followup.py

      - name: Install locked dependencies
        run: npm ci

      - name: Dependency security audit
        run: npm audit --audit-level=high

      - name: Application security audit
        run: npm run security:audit

      - name: TypeScript check
        run: npm run lint

      - name: Production build
        shell: bash
        run: |
          rm -rf dist
          npm run build
          test -f dist/server.cjs
          git diff --check

      - name: Verify source-public parity and intended scope
        shell: bash
        run: |
          cmp -s src/appScript.js public/appScript.js
          cmp -s src/settingsAndMisc.js public/settingsAndMisc.js
          changed="$(git diff --name-only | sort)"
          printf '%s\n' "$changed"
          bad="$(printf '%s\n' "$changed" | grep -v -E '^(src|public)/(appScript|settingsAndMisc)\.js$' || true)"
          if [ -n "$bad" ]; then
            echo "Unexpected files changed:"
            printf '%s\n' "$bad"
            exit 1
          fi

      - name: Commit validated follow-up
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No follow-up changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/settingsAndMisc.js public/settingsAndMisc.js
          git commit -m 'fix: scope restore mode flag correctly'
          git push origin HEAD:main
