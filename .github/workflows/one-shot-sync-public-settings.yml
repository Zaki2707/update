name: One-shot Sync Public Settings

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-sync-public-settings.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync source to public
        shell: bash
        run: |
          cp src/settingsAndMisc.js public/settingsAndMisc.js
          git diff --check

      - name: Commit sync
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/settingsAndMisc.js
          if git diff --cached --quiet; then
            echo 'Already synchronized.'
            exit 0
          fi
          git commit -m 'chore: sync settings source to public'
          git push origin HEAD:main
