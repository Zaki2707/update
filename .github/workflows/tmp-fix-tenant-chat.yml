name: Temporary Tenant Login Fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: '22.14.0'
          cache: npm

      - name: Patch tenant login and pre-login chat
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(text, old, new, label):
              if old not in text:
                  raise SystemExit(f'marker not found: {label}')
              return text.replace(old, new, 1)

          app_path = Path('src/appScript.js')
          chat_path = Path('src/chatModule.js')
          server_path = Path('server.ts')
          app = app_path.read_text(encoding='utf-8')
          chat = chat_path.read_text(encoding='utf-8')
          server = server_path.read_text(encoding='utf-8')

          # --- Frontend login: always send portal tenant explicitly. ---
          old = """        const response = await fetch('/api/login', {\n            method: 'POST',\n            headers: { 'Content-Type': 'application/json' },\n            body: JSON.stringify({ username: u, password: p })\n        });"""
          new = """        const portalPath = String(window.location.pathname || '');\n        const portalSlug = portalPath.startsWith('/m/') ? portalPath.substring(3).split('/')[0] : '';\n        const loginTenant = window.__activeTenant || null;\n        const response = await fetch('/api/login', {\n            method: 'POST',\n            headers: { 'Content-Type': 'application/json' },\n            body: JSON.stringify({\n                username: u,\n                password: p,\n                madrasahId: loginTenant?.id || '',\n                madrasahSlug: loginTenant?.slug || portalSlug || ''\n            })\n        });"""
          app = replace_once(app, old, new, 'frontend login request')

          old = """    if (!appState.currentUser && !savedUserData) {\n        console.log('TIDAK ADA SESI LOGIN TERSIMPAN.');\n        return;\n    }"""
          new = """    if (!appState.currentUser && !savedUserData) {\n        // Normal login-page state: do not start authenticated background work.\n        return;\n    }"""
          app = replace_once(app, old, new, 'quiet no-session login page')

          # --- Chat: never call protected endpoints without a JWT/session. ---
          old = """window.appState = window.appState || {};\nif (!window.appState.chats) window.appState.chats = [];\n\nasync function loadChats() {\n    try {"""
          new = """window.appState = window.appState || {};\nif (!window.appState.chats) window.appState.chats = [];\n\nfunction getChatAuthToken() {\n    const currentToken = window.appState?.currentUser?.token;\n    if (currentToken) return String(currentToken);\n    try {\n        const saved = JSON.parse(localStorage.getItem('madrasah_current_user') || 'null');\n        return saved?.token ? String(saved.token) : '';\n    } catch (_) {\n        return '';\n    }\n}\n\nfunction hasAuthenticatedChatSession() {\n    return Boolean(getChatAuthToken());\n}\nwindow.hasAuthenticatedChatSession = hasAuthenticatedChatSession;\n\nasync function loadChats() {\n    if (!hasAuthenticatedChatSession()) return false;\n    try {"""
          chat = replace_once(chat, old, new, 'chat auth gate')

          old = """    // Initial load\n    setTimeout(() => {\n        loadChats();\n    }, 1000);\n    \n    // Poll globally every 45 seconds for notifications when tab is visible\n    setInterval(() => {\n        if (document.visibilityState === 'visible' && window.appState?.settings?.chatEnabled) {\n            loadChats();\n        }\n    }, 45000);"""
          new = """    // Initial load only after an authenticated session exists.\n    setTimeout(() => {\n        if (hasAuthenticatedChatSession()) loadChats();\n    }, 1000);\n    \n    // Poll globally only while authenticated; the login page must stay silent.\n    setInterval(() => {\n        if (document.visibilityState === 'visible' && window.appState?.settings?.chatEnabled && hasAuthenticatedChatSession()) {\n            loadChats();\n        }\n    }, 45000);"""
          chat = replace_once(chat, old, new, 'chat initial/poll gate')

          # --- Backend login: resolve and enforce portal tenant. ---
          old = """app.post(\"/api/login\", async (req, res) => {\n  const { username, password } = req.body;\n  if (!username || !password) {"""
          new = """app.post(\"/api/login\", async (req, res) => {\n  const { username, password } = req.body;\n  const requestedTenantRaw = String(\n    req.body?.madrasahId ||\n    req.body?.madrasahSlug ||\n    req.query?.madrasahId ||\n    req.headers['x-madrasah-id'] ||\n    ''\n  ).trim();\n  const requestedTenant = requestedTenantRaw && requestedTenantRaw !== 'BOSS'\n    ? madrasahs.find((m: any) =>\n        String(m.id) === requestedTenantRaw ||\n        String(m.slug).toLowerCase() === requestedTenantRaw.toLowerCase()\n      )\n    : null;\n\n  if (requestedTenantRaw && requestedTenantRaw !== 'BOSS' && !requestedTenant) {\n    return res.status(404).json({ success: false, message: \"Portal madrasah tidak ditemukan.\" });\n  }\n\n  const loginTenantMatches = (entity: any): boolean => {\n    if (!requestedTenant) return true;\n    const entityTenant = String(entity?.madrasahId || entity?.madrasahSlug || 'default');\n    return entityTenant === String(requestedTenant.id) ||\n      entityTenant.toLowerCase() === String(requestedTenant.slug || '').toLowerCase();\n  };\n\n  if (!username || !password) {"""
          server = replace_once(server, old, new, 'backend login tenant resolver')

          old = """  const foundMadrasah = madrasahs.find(m => \n    (String(m.adminUser || '').toLowerCase() === uLower || String(m.slug || '').toLowerCase() === uLower) &&\n    verifyPassword(p, String(m.adminPass))\n  );"""
          new = """  const foundMadrasah = madrasahs.find(m => \n    (!requestedTenant || String(m.id) === String(requestedTenant.id) || String(m.slug).toLowerCase() === String(requestedTenant.slug || '').toLowerCase()) &&\n    (String(m.adminUser || '').toLowerCase() === uLower || String(m.slug || '').toLowerCase() === uLower) &&\n    verifyPassword(p, String(m.adminPass))\n  );"""
          server = replace_once(server, old, new, 'registered admin tenant lock')

          old = """  if (\n    adminPassVal &&\n    (\n      uLower === \"admin\" ||"""
          new = """  if (\n    (!requestedTenant || String(requestedTenant.id) === 'default' || String(requestedTenant.slug) === 'default') &&\n    adminPassVal &&\n    (\n      uLower === \"admin\" ||"""
          server = replace_once(server, old, new, 'default admin tenant guard')

          old = """  const teacher = teachers.find(t => (String(t.username || '').toLowerCase() === uLower || String(t.nip || '').toLowerCase() === uLower) && verifyPassword(p, String(t.password)));"""
          new = """  const teacher = teachers.find(t => loginTenantMatches(t) && (String(t.username || '').toLowerCase() === uLower || String(t.nip || '').toLowerCase() === uLower) && verifyPassword(p, String(t.password)));"""
          server = replace_once(server, old, new, 'teacher tenant lock')

          old = """  const studentCandidate = students.find(s =>\n    String(s.username || '').toLowerCase() === uLower ||\n    String(s.nis || '').toLowerCase() === uLower\n  );"""
          new = """  const studentCandidate = students.find(s =>\n    loginTenantMatches(s) && (\n      String(s.username || '').toLowerCase() === uLower ||\n      String(s.nis || '').toLowerCase() === uLower\n    )\n  );"""
          server = replace_once(server, old, new, 'student tenant lock')

          app_path.write_text(app, encoding='utf-8')
          chat_path.write_text(chat, encoding='utf-8')
          server_path.write_text(server, encoding='utf-8')
          print('Tenant login and chat patches applied.')
          PY

      - name: Install and validate
        run: |
          npm ci
          npm audit --audit-level=high
          npm run security:audit
          npm run lint
          rm -rf dist
          npm run build
          test -f dist/server.cjs
          git diff --check
          grep -q "hasAuthenticatedChatSession" src/chatModule.js
          grep -q "requestedTenantRaw" server.ts
          grep -q "madrasahSlug: loginTenant?.slug" src/appScript.js

      - name: Commit final source and remove temporary runner
        shell: bash
        run: |
          rm -f .github/workflows/tmp-fix-tenant-chat.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server.ts src/appScript.js public/appScript.js src/chatModule.js public/chatModule.js .github/workflows/tmp-fix-tenant-chat.yml
          git commit -m "fix: enforce tenant login and gate prelogin chat"
          git push origin HEAD:main
