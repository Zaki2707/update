name: One-shot Final LKPD Theme Race

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-final-lkpd-theme-race.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.14.0'
          cache: npm
      - name: Apply final race patch
        run: python scripts/patch-final-lkpd-theme-race.py
      - run: npm ci
      - run: npm run security:audit
      - run: npm run lint
      - name: Build
        run: |
          rm -rf dist
          npm run build
          test -f dist/server.cjs
          git diff --check
          cmp -s src/lkpdModule.js public/lkpdModule.js
          cmp -s src/themePackageModule.js public/themePackageModule.js
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/lkpdModule.js public/lkpdModule.js src/themePackageModule.js public/themePackageModule.js
          git diff --cached --quiet && exit 0
          git commit -m 'fix: await lkpd persistence before asset release'
          git push origin HEAD:main
