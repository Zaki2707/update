name: Apply Staged CBT Evaluasi Fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apply-validate-push:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract and run staged patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          workflow = Path('.github/workflows/one-time-cbt-evaluasi-fix.yml')
          text = workflow.read_text(encoding='utf-8')
          step_marker = '      - name: Apply exact patches\n'
          run_marker = '        run: |\n'
          next_marker = '\n      - name: Setup Node\n'

          step_pos = text.index(step_marker)
          start = text.index(run_marker, step_pos) + len(run_marker)
          end = text.index(next_marker, start)
          raw = text[start:end]

          code_lines = []
          for line in raw.splitlines():
              if line.startswith('          '):
                  code_lines.append(line[10:])
              else:
                  code_lines.append(line)

          code = '\n'.join(code_lines) + '\n'
          compile(code, '<staged-cbt-evaluasi-fix>', 'exec')
          exec(compile(code, '<staged-cbt-evaluasi-fix>', 'exec'), {})
          PY

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.14.0'
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: TypeScript check
        run: npm run lint

      - name: Application security audit
        run: npm run security:audit

      - name: Production build and source parity
        run: |
          npm run build
          git diff --check
          test -f dist/server.cjs
          cmp -s src/assessmentModule.js public/assessmentModule.js

      - name: Commit validated source and remove temporary workflows
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/one-time-cbt-evaluasi-fix.yml
          git rm .github/workflows/apply-staged-cbt-evaluasi-fix.yml
          git add server.ts src/assessmentModule.js public/assessmentModule.js
          git diff --cached --check
          git commit -m "fix: stabilize CBT soak and add bulk evaluation actions"
          git push origin HEAD:main
