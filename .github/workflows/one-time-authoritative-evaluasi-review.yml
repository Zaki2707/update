name: One-time Authoritative Evaluasi Review Fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch-validate-push:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply authoritative review patch
        run: python scripts/one-time-evaluasi-review-fix.py

      - name: Keep final scoring explicit and audit-compatible
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('server.ts')
          s = p.read_text(encoding='utf-8')
          old = "  const pgQuestions = masterQuestions.filter((q: any) => q.type !== 'esay' && q.type !== 'essay');\n  const essayQuestions = masterQuestions.filter((q: any) => q.type === 'esay' || q.type === 'essay');\n  const pgSummary = scoreMasterMultipleChoice(masterQuestions, finalAns);\n  const correctPGCount = pgSummary.correctPGCount;\n  const pgScore = pgSummary.pgScore;\n"
          new = "  let correctPGCount = 0;\n  const pgQuestions = masterQuestions.filter((q: any) => q.type !== 'esay' && q.type !== 'essay');\n  const essayQuestions = masterQuestions.filter((q: any) => q.type === 'esay' || q.type === 'essay');\n  pgQuestions.forEach((q: any) => {\n    const uAns = finalAns[q.id] !== undefined ? finalAns[q.id] : finalAns[String(q.id)];\n    if (isMasterMultipleChoiceAnswerCorrect(q, uAns)) correctPGCount++;\n  });\n\n  const pgScore = pgQuestions.length > 0 ? Math.round((correctPGCount / pgQuestions.length) * 100) : 0;\n"
          if old not in s:
              raise SystemExit('Expected patched final scoring block was not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.14.0'
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Validate application
        run: |
          npm audit --audit-level=high
          npm run lint
          npm run security:audit
          npm run build
          git diff --check
          test -f dist/server.cjs
          cmp -s src/assessmentModule.js public/assessmentModule.js
          grep -Fq 'app.get("/api/exam/review", requireAuth, requireRole' server.ts
          grep -Fq 'if (isMasterMultipleChoiceAnswerCorrect(q, uAns)) correctPGCount++;' server.ts
          grep -Fq 'const pgScore = pgQuestions.length > 0 ? Math.round((correctPGCount / pgQuestions.length) * 100) : 0;' server.ts
          grep -Fq 'async function openPreviewJawabanEvaluasi(studentId)' src/assessmentModule.js
          grep -Fq 'async function openKoreksiModal(studentId)' src/assessmentModule.js

      - name: Commit validated source and remove temporary patch files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm scripts/one-time-evaluasi-review-fix.py
          git rm .github/workflows/one-time-authoritative-evaluasi-review.yml
          git add server.ts src/assessmentModule.js public/assessmentModule.js
          git diff --cached --check
          git commit -m "fix: use authoritative answer keys in evaluasi review"
          git push origin HEAD:main
