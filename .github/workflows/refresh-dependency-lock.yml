name: Refresh dependency lock

on:
  push:
    branches:
      - fix/redeploy-dependency-audit-20260913
    paths:
      - .github/workflows/refresh-dependency-lock.yml

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/redeploy-dependency-audit-20260913
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.14.0'
          cache: npm

      - name: Regenerate lockfile
        run: npm install --package-lock-only --ignore-scripts

      - name: Show audit state
        run: npm audit || true

      - name: Commit refreshed lockfile and remove helper
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/refresh-dependency-lock.yml
          git add package-lock.json
          git diff --cached --check
          git commit -m "chore: regenerate dependency lockfile"
          git push origin HEAD:fix/redeploy-dependency-audit-20260913
