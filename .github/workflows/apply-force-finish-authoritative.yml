name: Apply Force Finish Authoritative Hardening

on:
  push:
    branches: [main]
    paths:
      - 'scripts/patch-force-finish-authoritative.cjs'
      - '.github/workflows/apply-force-finish-authoritative.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.14.0'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply targeted Force Finish hardening
        run: node scripts/patch-force-finish-authoritative.cjs

      - name: Verify Force Finish invariants
        shell: bash
        run: |
          grep -F "const incomingAnswers = isStaffForceFinish ? {} : filterAllowedAnswers(answers);" server.ts
          grep -F "Akun staf hanya dapat menyelesaikan attempt siswa melalui Force Finish." server.ts
          grep -F "Invalid/stale question IDs are dropped." server.ts

      - name: Application security audit
        run: npm run security:audit

      - name: TypeScript check
        run: npm run lint

      - name: Clean production build
        run: npm run build

      - name: Verify source/build parity
        shell: bash
        run: |
          for f in src/*.js; do
            b="public/$(basename "$f")"
            if [ -f "$b" ]; then
              cmp -s "$f" "$b" || { echo "Source/public drift: $f != $b"; exit 1; }
            fi
          done

      - name: Commit patch
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server.ts
          git commit -m "fix: enforce server-authoritative CBT force finish"
          git push origin HEAD:main
