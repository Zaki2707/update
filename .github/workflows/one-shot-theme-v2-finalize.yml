name: One-shot Theme Engine v2 Finalize

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-theme-v2-finalize.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.14.0'
          cache: npm

      - name: Wire Theme Engine v2 and sync public source
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/main.tsx')
          s = p.read_text(encoding='utf-8')
          needle = "import './themePackageModule.js';\n"
          addition = "import './themeEngineV2.js';\n"
          if addition not in s:
              if needle not in s:
                  raise SystemExit('themePackageModule import anchor not found')
              s = s.replace(needle, needle + addition, 1)
              p.write_text(s, encoding='utf-8')
          PY
          cp src/themeEngineV2.js public/themeEngineV2.js
          node --check src/themeEngineV2.js
          node --check public/themeEngineV2.js

      - name: Install locked dependencies
        run: npm ci

      - name: Dependency security audit
        run: npm audit --audit-level=high

      - name: Application security audit
        run: npm run security:audit

      - name: TypeScript check
        run: npm run lint

      - name: Production build
        shell: bash
        run: |
          rm -rf dist
          npm run build
          test -f dist/server.cjs
          git diff --check

      - name: Verify intended change scope
        shell: bash
        run: |
          changed="$(git status --porcelain | awk '{print $2}' | sort -u)"
          printf '%s\n' "$changed"
          unexpected="$(printf '%s\n' "$changed" | grep -v -E '^(src/main\.tsx|public/themeEngineV2\.js)$' || true)"
          if [ -n "$unexpected" ]; then
            echo 'Unexpected files changed:'
            printf '%s\n' "$unexpected"
            exit 1
          fi
          test -f public/themeEngineV2.js
          grep -q "themeEngineV2.js" src/main.tsx
          cmp -s src/themeEngineV2.js public/themeEngineV2.js

      - name: Commit validated Theme Engine v2 wiring
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/main.tsx public/themeEngineV2.js
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git commit -m 'feat(theme): enable Theme Engine v2'
          git push origin HEAD:main
