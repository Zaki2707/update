name: One-shot Realtime and Token Balance Fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-realtime-token-fix.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.14.0'
          cache: npm

      - name: Apply realtime and token patch
        run: python3 .github/scripts/fix_realtime_token_balance.py

      - name: Install locked dependencies
        run: npm ci

      - name: Dependency security audit
        run: npm audit --audit-level=high

      - name: Application security audit
        run: npm run security:audit

      - name: TypeScript check
        run: npm run lint

      - name: Production build
        shell: bash
        run: |
          rm -rf dist
          npm run build
          test -f dist/server.cjs
          git diff --check

      - name: Verify realtime and token invariants
        shell: bash
        run: |
          cmp -s src/appScript.js public/appScript.js
          grep -q "queueRealtimeKeySync(payload.key)" src/appScript.js
          grep -q "!isOnlineServerAuthoritativeStorage() && stateField === 'attendance'" src/appScript.js
          grep -q "!isOnlineServerAuthoritativeStorage() && stateField === 'teacherAttendance'" src/appScript.js
          grep -q "!isOnlineServerAuthoritativeStorage() && stateField === 'grades'" src/appScript.js
          grep -q 'app.get("/api/token-balance"' server.ts
          grep -q "scope: 'madrasah'" server.ts
          grep -q "await refreshAuthoritativeTokenBalance();" src/appScript.js

      - name: Commit validated fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/appScript.js public/appScript.js server.ts
          if git diff --cached --quiet; then
            echo "No source changes to commit"
            exit 1
          fi
          git commit -m "fix: stop realtime feedback loop and persist token balance"
          git push origin HEAD:main
