name: One-time Non-destructive Master Sync Fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-master-sync-nondestructive-fix.yml'

permissions:
  contents: write

jobs:
  patch-validate-push:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply non-destructive master sync patch
        run: python scripts/one-time-master-sync-nondestructive-fix.py

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.14.0'
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Validate application and guard semantics
        run: |
          npm audit --audit-level=high
          npm run lint
          npm run security:audit
          npm run build
          git diff --check
          test -f dist/server.cjs
          grep -Fq 'if (isOnlineMode) {' server.ts
          grep -Fq 'Explicit DELETE endpoints are the only supported destructive path for master data.' server.ts
          grep -Fq 'return [...otherItems, ...Array.from(currentMap.values())];' server.ts
          grep -Fq '[Master Sync Guard]' server.ts
          python - <<'PY'
          from pathlib import Path
          s = Path('server.ts').read_text(encoding='utf-8')
          start = s.index('function mergeTenantEntityListData(')
          end = s.index('\n}\n', start) + 2
          block = s[start:end]
          assert 'for (const item of mergedIncoming)' in block
          assert 'currentMap.set(String(item.id), item);' in block
          assert 'Array.from(currentMap.values())' in block
          assert "if (isOnlineMode)" in block
          print('master sync guard semantics verified')
          PY

      - name: Commit validated source and remove temporary patch files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm scripts/one-time-master-sync-nondestructive-fix.py
          git rm .github/workflows/one-time-master-sync-nondestructive-fix.yml
          git add server.ts
          git diff --cached --check
          git commit -m "fix: make online master sync non-destructive"
          git push origin HEAD:main
