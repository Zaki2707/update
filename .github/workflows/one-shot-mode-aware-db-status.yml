name: One-shot Mode-aware DB Status Patch

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-mode-aware-db-status.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.14.0'
          cache: npm

      - name: Apply patch
        run: python scripts/patch-mode-aware-db-status.py

      - name: Install dependencies
        run: npm ci

      - name: Security audit
        run: npm run security:audit

      - name: TypeScript check
        run: npm run lint

      - name: Production build
        shell: bash
        run: |
          rm -rf dist
          npm run build
          test -f dist/server.cjs
          git diff --check

      - name: Commit patch
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add server.ts src/settingsAndMisc.js
          if git diff --cached --quiet; then
            echo 'No source changes to commit.'
            exit 0
          fi
          git commit -m 'fix: make storage diagnostics mode-aware'
          git push origin HEAD:main
