name: Temporary Tenant Runtime And Password Display Fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tmp-fix-tenant-runtime-password.yml'

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: '22.14.0'
          cache: npm

      - name: Patch tenant runtime isolation and admin password display
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def rep(text, old, new, label, count=1):
              n = text.count(old)
              if n != count:
                  raise SystemExit(f'{label}: expected {count} match(es), found {n}')
              return text.replace(old, new, count)

          # ---------------- server.ts ----------------
          server_path = Path('server.ts')
          server = server_path.read_text(encoding='utf-8')

          old_merge = """function mergeArrays(existing: any[], incoming: any[], key: string): any[] {
            if (!Array.isArray(existing)) return incoming;
            if (!Array.isArray(incoming)) return incoming;

            let idField = 'id';
            if (key === 'students') idField = 'nis';
            else if (key === 'teachers') idField = 'nip';

            const existingMap = new Map<string, any>();
            existing.forEach(item => {
              if (item && typeof item === 'object') {
                const idVal = item[idField] || item['id'];
                if (idVal !== undefined) {
                  existingMap.set(String(idVal), item);
                }
              }
            });

            incoming.forEach(item => {
              if (item && typeof item === 'object') {
                const idVal = item[idField] || item['id'];
                if (idVal !== undefined) {
                  existingMap.set(String(idVal), item);
                }
              }
            });

            return Array.from(existingMap.values());
          }"""

          new_merge = """function tenantIdentityKey(item: any): string {
            const tenantId = String(item?.madrasahId || 'default').trim().toLowerCase() || 'default';
            const tenantSlug = String(item?.madrasahSlug || 'default').trim().toLowerCase() || 'default';
            return `${tenantId}|${tenantSlug}`;
          }

          function dedupeStudentsByTenantAndNis(list: any[]): any[] {
            if (!Array.isArray(list)) return [];
            const seen = new Set<string>();
            return list.filter((student: any) => {
              if (!student) return false;
              const nis = String(student.nis || '').trim().toLowerCase();
              if (!nis) return true;
              const compositeKey = `${tenantIdentityKey(student)}|${nis}`;
              if (seen.has(compositeKey)) return false;
              seen.add(compositeKey);
              return true;
            });
          }

          function mergeArrays(existing: any[], incoming: any[], key: string): any[] {
            if (!Array.isArray(existing)) return incoming;
            if (!Array.isArray(incoming)) return incoming;

            let idField = 'id';
            if (key === 'students') idField = 'nis';
            else if (key === 'teachers') idField = 'nip';

            const buildMergeKey = (item: any): string | null => {
              if (!item || typeof item !== 'object') return null;
              const idVal = item[idField] || item['id'];
              if (idVal === undefined || idVal === null) return null;
              if (key === 'students' || key === 'teachers') {
                return `${tenantIdentityKey(item)}|${String(idVal)}`;
              }
              return String(idVal);
            };

            const existingMap = new Map<string, any>();
            existing.forEach(item => {
              const mergeKey = buildMergeKey(item);
              if (mergeKey !== null) existingMap.set(mergeKey, item);
            });

            incoming.forEach(item => {
              const mergeKey = buildMergeKey(item);
              if (mergeKey !== null) existingMap.set(mergeKey, item);
            });

            return Array.from(existingMap.values());
          }"""
          server = rep(server, old_merge, new_merge, 'tenant-aware mergeArrays')

          old_hydrate_dedupe = """    // Deduplicate students by nis
              const seenNis = new Set();
              students = (students || []).filter(s => {
                const nis = String(s.nis || '').trim();
                if (!nis) return true;
                if (seenNis.has(nis)) return false;
                seenNis.add(nis);
                return true;
              });"""
          new_hydrate_dedupe = """    // NIS is only unique inside one madrasah. Never collapse students across tenants.
              students = dedupeStudentsByTenantAndNis(students || []);"""
          server = rep(server, old_hydrate_dedupe, new_hydrate_dedupe, 'hydrate tenant NIS dedupe')

          old_refresh_dedupe = """        if (dbData['students'] !== undefined) {
                    const seenNis = new Set();
                    students = (dbData['students'] || []).filter((s: any) => {
                      const nis = String(s.nis || '').trim();
                      if (!nis) return true;
                      if (seenNis.has(nis)) return false;
                      seenNis.add(nis);
                      return true;
                    });
                  }"""
          new_refresh_dedupe = """        if (dbData['students'] !== undefined) {
                    students = dedupeStudentsByTenantAndNis(dbData['students'] || []);
                  }"""
          server = rep(server, old_refresh_dedupe, new_refresh_dedupe, 'refresh tenant NIS dedupe')

          old_filter_return = """    if (matched.length > 0) return matched;
            }
            
            const defaultM = madrasahs.find(m => m.id === 'default' || m.slug === 'default') || madrasahs[0];"""
          new_filter_return = """    // A real non-default tenant must stay empty when it has no records.
              // Falling through to the default tenant here would leak another madrasah's data.
              return matched;
            }
            
            const defaultM = madrasahs.find(m => m.id === 'default' || m.slug === 'default') || madrasahs[0];"""
          server = rep(server, old_filter_return, new_filter_return, 'empty tenant must not fall through')

          old_tenant_fn = """function getRequestMadrasahId(req: any): string | null {
            // Enforce tenant strictly from JWT session if authenticated
            const authUser = req.user || getAuthUser(req);
            if (authUser) {
              const role = String(authUser.role || '').toLowerCase();
              // Only super admin ('bos' / 'superadmin') can query cross-tenant or override via header/query
              if (role === 'bos' || role === 'superadmin') {
                const headerVal = req.headers['x-madrasah-id'];
                if (headerVal) return String(headerVal);
                if (req.query.madrasahId) return String(req.query.madrasahId);
                return authUser.madrasahId || 'default';
              }
              // For anyone else (student, teacher, local school admin), strictly lock to their own token's madrasah
              return authUser.madrasahId || 'default';
            }

            // Fallback for unauthenticated requests
            const headerVal = req.headers['x-madrasah-id'];
            if (headerVal) return String(headerVal);
            if (req.query.madrasahId) return String(req.query.madrasahId);
            return null;
          }"""

          new_tenant_fn = """function getRequestMadrasahId(req: any): string | null {
            // Enforce tenant strictly from JWT session if authenticated.
            const authUser = req.user || getAuthUser(req);
            if (authUser) {
              const role = String(authUser.role || '').toLowerCase();

              // Only super admin ('bos' / 'superadmin') can query cross-tenant or override via header/query.
              if (role === 'bos' || role === 'superadmin') {
                const headerVal = req.headers['x-madrasah-id'];
                if (headerVal) return String(headerVal);
                if (req.query.madrasahId) return String(req.query.madrasahId);
                return String(authUser.madrasahId || authUser.madrasahSlug || 'default');
              }

              const tokenTenant = String(authUser.madrasahId || authUser.madrasahSlug || '').trim();
              if (tokenTenant) return tokenTenant;

              // Compatibility for JWTs issued before tenant claims were added to teacher/student login.
              // Resolve only when the authenticated account maps unambiguously to exactly one record.
              const isTeacherRole = role === 'teacher' || role === 'guru';
              const isStudentRole = ['student', 'siswa', 'class_leader', 'ketua_kelas'].includes(role);
              const source = isTeacherRole ? (teachers || []) : (isStudentRole ? (students || []) : []);
              if (source.length > 0) {
                let candidates = source.filter((item: any) => String(item?.id || '') === String(authUser.id || ''));
                if (candidates.length !== 1 && authUser.username) {
                  candidates = source.filter((item: any) => String(item?.username || '').toLowerCase() === String(authUser.username).toLowerCase());
                }
                if (candidates.length === 1) {
                  const resolvedTenant = String(candidates[0]?.madrasahId || candidates[0]?.madrasahSlug || '').trim();
                  if (resolvedTenant) return resolvedTenant;
                }
              }

              // Fail closed to the default tenant instead of trusting client headers for a normal user.
              return 'default';
            }

            // Fallback for unauthenticated requests.
            const headerVal = req.headers['x-madrasah-id'];
            if (headerVal) return String(headerVal);
            if (req.query.madrasahId) return String(req.query.madrasahId);
            return null;
          }"""
          server = rep(server, old_tenant_fn, new_tenant_fn, 'JWT tenant resolver')

          old_login_match = """  const loginTenantMatches = (entity: any): boolean => {
              if (!requestedTenant) return true;
              const entityTenant = String(entity?.madrasahId || entity?.madrasahSlug || 'default');
              return entityTenant === String(requestedTenant.id) ||
                entityTenant.toLowerCase() === String(requestedTenant.slug || '').toLowerCase();
            };"""
          new_login_match = """  const loginTenantMatches = (entity: any): boolean => {
              const entityTenant = String(entity?.madrasahId || entity?.madrasahSlug || 'default');
              if (!requestedTenant) {
                const defaultM = madrasahs.find((m: any) => String(m.id) === 'default' || String(m.slug) === 'default') || madrasahs[0];
                const defaultId = String(defaultM?.id || 'default');
                const defaultSlug = String(defaultM?.slug || 'default').toLowerCase();
                return entityTenant === 'default' || entityTenant === defaultId || entityTenant.toLowerCase() === defaultSlug;
              }
              return entityTenant === String(requestedTenant.id) ||
                entityTenant.toLowerCase() === String(requestedTenant.slug || '').toLowerCase();
            };"""
          server = rep(server, old_login_match, new_login_match, 'login tenant default lock')

          old_teacher = """      role: \"teacher\",
                mapel: teacher.mapel,
                cbtTokenBalance: teacher.cbtTokenBalance !== undefined ? teacher.cbtTokenBalance : 0"""
          new_teacher = """      role: \"teacher\",
                mapel: teacher.mapel,
                madrasahId: teacher.madrasahId || requestedTenant?.id || teacher.madrasahSlug || 'default',
                madrasahSlug: teacher.madrasahSlug || requestedTenant?.slug || teacher.madrasahId || 'default',
                cbtTokenBalance: teacher.cbtTokenBalance !== undefined ? teacher.cbtTokenBalance : 0"""
          server = rep(server, old_teacher, new_teacher, 'teacher JWT tenant claims')

          old_student = """      class_id: student.classId,
                role: student.role || \"student\",
                photo: student.photo,"""
          new_student = """      class_id: student.classId,
                role: student.role || \"student\",
                madrasahId: student.madrasahId || requestedTenant?.id || student.madrasahSlug || 'default',
                madrasahSlug: student.madrasahSlug || requestedTenant?.slug || student.madrasahId || 'default',
                photo: student.photo,"""
          server = rep(server, old_student, new_student, 'student JWT tenant claims')

          server_path.write_text(server, encoding='utf-8')

          # ---------------- src/adminModules.js ----------------
          admin_path = Path('src/adminModules.js')
          admin = admin_path.read_text(encoding='utf-8')

          marker = """// Student Module
          function renderStudentModule(container) {"""
          helper = """// Student Module
          function getCachedStudentTemporaryPassword(student) {
              if (!student) return '';
              try {
                  const cached = JSON.parse(sessionStorage.getItem('cbt_print_credentials') || '[]');
                  if (!Array.isArray(cached)) return '';
                  const byId = cached.find(c => String(c?.studentId || '') === String(student.id || ''));
                  const byUsername = cached.find(c => c?.username && String(c.username).toLowerCase() === String(student.username || '').toLowerCase());
                  const credential = byId || byUsername;
                  return credential?.temporaryPassword ? String(credential.temporaryPassword) : '';
              } catch (_) {
                  return '';
              }
          }

          function escapeStudentCredentialHtml(value) {
              return String(value ?? '').replace(/[&<>\"']/g, ch => ({
                  '&': '&amp;', '<': '&lt;', '>': '&gt;', '\"': '&quot;', "'": '&#39;'
              }[ch]));
          }

          function renderStudentPasswordForAdmin(student) {
              const temporaryPassword = getCachedStudentTemporaryPassword(student);
              if (temporaryPassword) {
                  return `<span class=\"font-mono text-xs text-slate-800\">${escapeStudentCredentialHtml(temporaryPassword)}</span>`;
              }
              return `<button type=\"button\" onclick=\"window.openResetPasswordModal ? window.openResetPasswordModal('${escapeStudentCredentialHtml(student?.id || '')}', 'student') : openStudentModal('${escapeStudentCredentialHtml(student?.id || '')}')\" class=\"text-[10px] font-semibold text-amber-700 hover:text-amber-800 underline underline-offset-2\" title=\"Password lama tersimpan sebagai hash dan tidak dapat dibaca kembali\">Tersimpan aman · Reset</button>`;
          }

          function studentPasswordForExport(student) {
              return getCachedStudentTemporaryPassword(student) || 'Reset diperlukan';
          }

          function renderStudentModule(container) {"""
          admin = rep(admin, marker, helper, 'student credential display helpers')
          admin = rep(admin, '<td class="p-4 font-mono text-xs">${s.password}</td>', '<td class="p-4 font-mono text-xs">${renderStudentPasswordForAdmin(s)}</td>', 'student table password', count=1)
          admin = rep(admin, "'Password': s.password", "'Password': studentPasswordForExport(s)", 'student excel password', count=1)
          admin = rep(admin, '<td class="font-mono">${s.password}</td>', '<td class="font-mono">${escapeStudentCredentialHtml(studentPasswordForExport(s))}</td>', 'student print password', count=1)
          admin_path.write_text(admin, encoding='utf-8')

          # ---------------- src/settingsAndMisc.js ----------------
          settings_path = Path('src/settingsAndMisc.js')
          settings = settings_path.read_text(encoding='utf-8')
          old_success = """        showToast('Password akun berhasil direset.', 'success');"""
          new_success = """        if (currentType !== 'teacher') {
                      try {
                          const source = appState.students || [];
                          const student = source.find(item => String(item.id) === String(userId));
                          const existing = JSON.parse(sessionStorage.getItem('cbt_print_credentials') || '[]');
                          const map = new Map();
                          (Array.isArray(existing) ? existing : []).forEach(c => {
                              if (c?.studentId) map.set(String(c.studentId), c);
                          });
                          map.set(String(userId), {
                              studentId: String(userId),
                              username: student?.username || '',
                              temporaryPassword: newPassword
                          });
                          sessionStorage.setItem('cbt_print_credentials', JSON.stringify(Array.from(map.values())));
                      } catch (_) {}
                  }
                  showToast('Password akun berhasil direset.', 'success');"""
          settings = rep(settings, old_success, new_success, 'cache student reset credential', count=1)
          settings_path.write_text(settings, encoding='utf-8')

          print('Tenant runtime, dedupe, JWT claims, and password display patches applied.')
          PY

      - name: Validate
        run: |
          npm ci
          npm audit --audit-level=high
          npm run security:audit
          npm run lint
          rm -rf dist
          npm run build
          test -f dist/server.cjs
          node --check src/adminModules.js
          node --check src/settingsAndMisc.js
          grep -q "dedupeStudentsByTenantAndNis" server.ts
          grep -q "return matched;" server.ts
          grep -q "madrasahId: teacher.madrasahId" server.ts
          grep -q "madrasahId: student.madrasahId" server.ts
          grep -q "renderStudentPasswordForAdmin" src/adminModules.js
          ! grep -q '>${s.password}</td>' src/adminModules.js
          git diff --check

      - name: Commit final source and remove temporary workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f .github/workflows/tmp-fix-tenant-runtime-password.yml
          git add server.ts src/adminModules.js public/adminModules.js src/settingsAndMisc.js public/settingsAndMisc.js .github/workflows/tmp-fix-tenant-runtime-password.yml
          git commit -m 'fix: preserve tenant student data across redeploy'
          git push origin HEAD:main
