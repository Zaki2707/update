name: Apply Redeploy Hardening

on:
  push:
    branches: [main]
    paths:
      - scripts/apply-redeploy-hardening.cjs
      - .github/workflows/apply-redeploy-hardening.yml

permissions:
  contents: write

concurrency:
  group: apply-redeploy-hardening
  cancel-in-progress: false

jobs:
  patch-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.14.0'
          cache: npm

      - name: Apply verified patch
        run: node scripts/apply-redeploy-hardening.cjs

      - name: Align legacy audit and regression assertions with hardened behavior
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          {
            const p = 'scripts/security-audit.cjs';
            let s = fs.readFileSync(p, 'utf8');
            const oldCrud = `  ['Online CRUD sync omission is non-destructive', server.includes('function mergeTenantCrudSyncData(') && server.includes('Explicit DELETE routes') && server.includes("questions = mergeTenantCrudSyncData(questions, data, req)") && server.includes("rooms = mergeTenantCrudSyncData(rooms, data, req)") && server.includes("grades = mergeTenantCrudSyncData(grades, data, req)")],`;
            const newCrud = `  ['Online CRUD sync omission is non-destructive', server.includes('function mergeTenantCrudSyncData(') && server.includes('Explicit DELETE routes') && server.includes('isTeacherSyncRole ? mergeTenantScopedSyncRecords(questions, data, req') && server.includes("rooms = mergeTenantCrudSyncData(rooms, data, req)") && server.includes('isTeacherSyncRole ? mergeTenantScopedSyncRecords(grades, data, req')],`;
            const oldLkpd = `  ['Student LKPD merge only accepts own submissions', server.includes("String(sub.studentId) !== String(authenticatedUser?.id || '')")],`;
            const newLkpd = `  ['Student LKPD merge only accepts own submissions', server.includes('LKPD_STUDENT_SUBMISSION_WRITE_SCOPE') && server.includes("String(sub?.studentId || '') === String(authenticatedUser.id)") && server.includes('scores: existingOwn?.scores || {}') && server.includes('isGraded: existingOwn?.isGraded === true')],`;
            if (!s.includes(oldCrud) || !s.includes(oldLkpd)) throw new Error('Legacy audit assertion anchor missing');
            s = s.replace(oldCrud, newCrud).replace(oldLkpd, newLkpd);
            fs.writeFileSync(p, s);
          }
          {
            const p = 'scripts/hardening-regression.ts';
            let s = fs.readFileSync(p, 'utf8');
            const oldDelta = `  assert.match(server, /saveDeltaDb\\('activeExamSessions', legacyKey, null\\)/);`;
            const newDelta = `  assert.match(server, /queueDelta\\('activeExamSessions', legacyKey, null\\)/);\n  assert.match(server, /await saveDeltaBatchDb\\(deltaWrites\\)/);`;
            const badMonitorRegex = `  assert.match(server, /Guru hanya dapat memonitor ujian mata pelajaran/bank soal yang diampu/);`;
            const goodMonitorAssertion = `  assert.equal(server.includes('Guru hanya dapat memonitor ujian mata pelajaran/bank soal yang diampu'), true);`;
            const badLkpdRegex = `  assert.match(lkpdModule, /fetch('/api/lkpds')/);`;
            const goodLkpdAssertion = `  assert.equal(lkpdModule.includes("fetch('/api/lkpds')"), true);`;
            if (!s.includes(oldDelta) || !s.includes(badMonitorRegex) || !s.includes(badLkpdRegex)) throw new Error('Legacy regression assertion anchor missing');
            s = s.replace(oldDelta, newDelta)
                 .replace(badMonitorRegex, goodMonitorAssertion)
                 .replace(badLkpdRegex, goodLkpdAssertion);
            fs.writeFileSync(p, s);
          }
          NODE

      - name: Install locked dependencies
        run: npm ci

      - name: Dependency audit
        run: npm audit --audit-level=high

      - name: Application security audit
        id: security_audit
        shell: bash
        run: |
          set -o pipefail
          npm run security:audit 2>&1 | tee security-audit.log

      - name: Upload security audit diagnostics
        if: failure() && steps.security_audit.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: redeploy-hardening-security-audit
          path: security-audit.log
          retention-days: 1

      - name: Hardening regression
        id: hardening_regression
        shell: bash
        run: |
          set -o pipefail
          npm run hardening:regression 2>&1 | tee hardening-regression.log

      - name: Upload hardening regression diagnostics
        if: failure() && steps.hardening_regression.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: redeploy-hardening-regression
          path: hardening-regression.log
          retention-days: 1

      - name: TypeScript check
        id: typescript_check
        shell: bash
        run: |
          set -o pipefail
          npm run lint 2>&1 | tee typescript-check.log

      - name: Upload TypeScript diagnostics
        if: failure() && steps.typescript_check.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: redeploy-hardening-typescript
          path: typescript-check.log
          retention-days: 1

      - name: Production build
        id: production_build
        shell: bash
        run: |
          set -o pipefail
          rm -rf dist
          (npm run build && test -f dist/server.cjs && git diff --check) 2>&1 | tee production-build.log

      - name: Upload production build diagnostics
        if: failure() && steps.production_build.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: redeploy-hardening-build
          path: production-build.log
          retention-days: 1

      - name: Commit hardened source and remove runner
        shell: bash
        run: |
          rm -f scripts/apply-redeploy-hardening.cjs .github/workflows/apply-redeploy-hardening.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No source changes to commit."
            exit 1
          fi
          git commit -m "fix: close remaining redeploy security blockers"
          git push origin HEAD:main
