name: Apply Backup Fix

on:
  push:
    paths:
      - '.github/workflows/apply-backup-fix.yml'
      - 'scripts/apply-backup-fix.cjs'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22.14.0'
      - name: Apply targeted patch
        run: node scripts/apply-backup-fix.cjs
      - name: Install dependencies
        run: npm ci
      - name: Security audit
        run: npm run security:audit
      - name: TypeScript check
        run: npm run lint
      - name: Clean production build
        run: npm run clean && npm run build
      - name: Diff sanity
        run: git diff --check
      - name: Commit patched source
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No patch changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server.ts src/settingsAndMisc.js public/settingsAndMisc.js tests/reset-loadtest-passwords.ps1 tests/README-loadtest.md
          git commit -m "fix: preserve account access across backup restore"
          git push origin HEAD:main
