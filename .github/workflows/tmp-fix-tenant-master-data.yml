name: Temporary Tenant Master Data Fix

on:
  push:
    branches: [main]
    paths:
      - '.github/tmp_fix_tenant_master.py'
      - '.github/workflows/tmp-fix-tenant-master-data.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22.14.0'
          cache: npm
      - name: Apply patch
        run: python3 .github/tmp_fix_tenant_master.py
      - name: Validate
        run: |
          npm ci
          npm audit --audit-level=high
          npm run security:audit
          npm run lint
          rm -rf dist
          npm run build
          test -f dist/server.cjs
          git diff --check
      - name: Commit final source
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f .github/tmp_fix_tenant_master.py .github/workflows/tmp-fix-tenant-master-data.yml
          git add server.ts .github/tmp_fix_tenant_master.py .github/workflows/tmp-fix-tenant-master-data.yml
          git commit -m 'fix: isolate tenant master data writes'
          git push origin HEAD:main
