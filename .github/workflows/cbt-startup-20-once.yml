name: CBT Startup 20 One-Time

on:
  push:
    branches:
      - run/cbt-startup-20-20260913

permissions:
  contents: read

concurrency:
  group: cbt-startup-20-one-time
  cancel-in-progress: false

jobs:
  startup:
    name: CBT startup diagnostic / 20 VUs
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      BASE_URL: https://madrasahku.ai.studio
      TENANT: ${{ vars.LOADTEST_TENANT || 'default' }}
      EXAM_ID: ${{ vars.LOADTEST_EXAM_ID }}
      LOADTEST_STUDENT_PASSWORD: ${{ secrets.LOADTEST_STUDENT_PASSWORD }}
      ACCOUNTS_FILE: ./accounts.local.json
      VUS: "20"
      RAMP_SECONDS: "20"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Safety preflight
        shell: bash
        run: |
          set -euo pipefail
          test "${BASE_URL}" = "https://madrasahku.ai.studio"
          if [[ -z "${EXAM_ID}" ]]; then
            echo "::error::Repository variable LOADTEST_EXAM_ID is not configured."
            exit 1
          fi
          if [[ -z "${LOADTEST_STUDENT_PASSWORD}" ]]; then
            echo "::error::Repository secret LOADTEST_STUDENT_PASSWORD is not configured."
            exit 1
          fi
          echo "Preflight passed for 20 dummy students."

      - name: Generate ephemeral dummy account file
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const password = process.env.LOADTEST_STUDENT_PASSWORD || '';
          if (!password) throw new Error('LOADTEST_STUDENT_PASSWORD is empty');
          const accounts = Array.from({ length: 800 }, (_, i) => ({
            username: `loadtest${String(i + 1).padStart(3, '0')}`,
            password
          }));
          fs.writeFileSync('tests/accounts.local.json', JSON.stringify(accounts), {
            encoding: 'utf8',
            mode: 0o600
          });
          console.log(`Generated ${accounts.length} ephemeral dummy accounts.`);
          NODE

      - name: Install k6
        uses: grafana/setup-k6-action@v1

      - name: Verify production health
        shell: bash
        run: |
          set -euo pipefail
          STATUS="$(curl -sS -o /tmp/health.json -w '%{http_code}' --connect-timeout 10 --max-time 20 "${BASE_URL}/api/health")"
          echo "Health HTTP status: ${STATUS}"
          if [[ "${STATUS}" != "200" ]]; then
            cat /tmp/health.json || true
            exit 1
          fi

      - name: Run startup diagnostic
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p tests/results
          k6 run --summary-export="tests/results/startup-20-${GITHUB_RUN_ID}.json" tests/k6-cbt-startup-diagnostic.js

      - name: Upload k6 summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cbt-startup-20-${{ github.run_id }}
          path: tests/results/*.json
          if-no-files-found: warn
          retention-days: 14

      - name: Remove ephemeral credentials
        if: always()
        shell: bash
        run: |
          rm -f tests/accounts.local.json
          rm -f /tmp/health.json
