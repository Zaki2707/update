name: Apply Evaluation Fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-evaluasi-fix.yml'
      - 'scripts/patch-evaluasi-fix.cjs'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.14.0'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply targeted evaluation patch
        run: node scripts/patch-evaluasi-fix.cjs

      - name: Application security audit
        run: npm run security:audit

      - name: TypeScript check
        run: npm run lint

      - name: Clean production build
        run: npm run build

      - name: Verify source/build parity
        shell: bash
        run: |
          cmp -s src/assessmentModule.js public/assessmentModule.js || {
            echo 'assessmentModule source/public mismatch'
            exit 1
          }

      - name: Commit patch
        shell: bash
        run: |
          if git diff --quiet -- src/assessmentModule.js public/assessmentModule.js; then
            echo 'No patch changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/assessmentModule.js public/assessmentModule.js
          git commit -m 'fix: sync completed CBT results in evaluation'
          git push origin main
