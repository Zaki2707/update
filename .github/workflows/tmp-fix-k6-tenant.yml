name: Temporary K6 Tenant Compatibility Fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: '22.14.0'

      - name: Patch k6 tenant handling
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('tests/k6-cbt-load.js')
          text = path.read_text(encoding='utf-8')

          def rep(old, new, label):
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected 1 match, found {count}')
              text = text.replace(old, new, 1)

          rep(
              "const TENANT = String(__ENV.TENANT || 'default');",
              "const TENANT = String(__ENV.TENANT || '').trim();",
              'tenant default'
          )

          rep(
              """function authHeaders(token) {\n  return {\n    'Content-Type': 'application/json',\n    Authorization: `Bearer ${token}`,\n    'X-Auth-Token': token,\n    'X-Madrasah-Id': TENANT,\n    'X-User-Role': 'student',\n  };\n}""",
              """function authHeaders(token, tenant = '') {\n  const headers = {\n    'Content-Type': 'application/json',\n    Authorization: `Bearer ${token}`,\n    'X-Auth-Token': token,\n    'X-User-Role': 'student',\n  };\n  if (tenant) headers['X-Madrasah-Id'] = tenant;\n  return headers;\n}""",
              'auth headers'
          )

          rep(
              """  const loginRes = postJson('/api/login', {\n    username: String(account.username),\n    password: String(account.password),\n    madrasahId: TENANT,\n    madrasahSlug: TENANT,\n  }, { 'Content-Type': 'application/json', 'X-Madrasah-Id': TENANT }, 'POST /api/login');""",
              """  const loginBody = {\n    username: String(account.username),\n    password: String(account.password),\n  };\n  const loginHeaders = { 'Content-Type': 'application/json' };\n  if (TENANT) {\n    loginBody.madrasahId = TENANT;\n    loginBody.madrasahSlug = TENANT;\n    loginHeaders['X-Madrasah-Id'] = TENANT;\n  }\n  const loginRes = postJson('/api/login', loginBody, loginHeaders, 'POST /api/login');""",
              'login request'
          )

          rep(
              """  const headers = authHeaders(token);\n  const studentId = String(loginData?.user?.id || account.studentId || '');""",
              """  const effectiveTenant = String(\n    TENANT ||\n    loginData?.user?.madrasahId ||\n    loginData?.user?.madrasahSlug ||\n    ''\n  ).trim();\n  const headers = authHeaders(token, effectiveTenant);\n  const studentId = String(loginData?.user?.id || account.studentId || '');\n  const tenantQuery = effectiveTenant ? `?madrasahId=${encodeURIComponent(effectiveTenant)}` : '';""",
              'effective tenant'
          )

          rep(
              """  const examsRes = http.get(\n    `${BASE_URL}/api/exams?madrasahId=${encodeURIComponent(TENANT)}`,\n    tagged(headers, 'GET /api/exams')\n  );""",
              """  const examsRes = http.get(\n    `${BASE_URL}/api/exams${tenantQuery}`,\n    tagged(headers, 'GET /api/exams')\n  );""",
              'exam tenant query'
          )

          rep(
              """  const summaryRes = http.get(\n    `${BASE_URL}/api/exam/my-summary?madrasahId=${encodeURIComponent(TENANT)}`,\n    tagged(headers, 'GET /api/exam/my-summary')\n  );""",
              """  const summaryRes = http.get(\n    `${BASE_URL}/api/exam/my-summary${tenantQuery}`,\n    tagged(headers, 'GET /api/exam/my-summary')\n  );""",
              'summary tenant query'
          )

          path.write_text(text, encoding='utf-8')
          print('K6 tenant compatibility patch applied.')
          PY

      - name: Validate k6 harness
        run: |
          node --check tests/k6-cbt-load.js
          ! grep -q "__ENV.TENANT || 'default'" tests/k6-cbt-load.js
          grep -q "effectiveTenant" tests/k6-cbt-load.js
          git diff --check

      - name: Commit patch and remove temporary workflow
        shell: bash
        run: |
          rm -f .github/workflows/tmp-fix-k6-tenant.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/k6-cbt-load.js .github/workflows/tmp-fix-k6-tenant.yml
          git commit -m "fix: make k6 tenant handling compatible with strict login"
          git push origin HEAD:main
